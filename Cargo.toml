[package]
name = "dpb"
version = "1.0.5"
edition = "2021"

[dependencies]
clap = { version = "4.5.16", features = ["derive"] }
log = "0.4.22"
reqwest = { version = "0.13.4", features = ["json", "blocking", "rustls"] }
serde = { version = "1.0.204", features = ["derive"] }
